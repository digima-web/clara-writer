<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clara Writer</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="icon-192.png">
</head>
<body class="theme-yellow">

<header id="status">
  <span id="where"></span>
  <span id="info"></span>
  <span id="save"></span>
</header>

<main id="area">
  <div id="sheet">
    <div id="backdrop" aria-hidden="true"></div>
    <textarea id="editor" spellcheck="true" readonly></textarea>
  </div>
</main>

<section id="claude">
  <div id="answer"></div>
  <div class="ask-row">
    <textarea id="ask" rows="2"></textarea>
    <button id="send" type="button"></button>
  </div>
</section>

<div id="working" hidden></div>

<div id="overlay" hidden>
  <div id="panel" role="dialog" aria-modal="true">
    <h2 id="panel-title"></h2>
    <ul id="list"></ul>
    <input id="field" type="text" hidden>
    <p id="panel-help"></p>
  </div>
</div>

<div id="notice" role="status" aria-live="polite" hidden></div>

<script src="app.js"></script>
</body>
</html>

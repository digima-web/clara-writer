# Builds the download package and publishes a GitHub release
# every time a version tag (v1.0.0, v1.1.0, ...) is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that VERSION matches the tag
        run: |
          test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}"

      - name: Build clara-writer.zip
        run: git archive --format=zip -o clara-writer.zip HEAD

      - name: Release notes
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then cp "$f" notes.md; else echo "Clara Writer ${GITHUB_REF_NAME}" > notes.md; fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" clara-writer.zip Install-Clara-Writer.bat \
            --title "Clara Writer ${GITHUB_REF_NAME#v}" --notes-file notes.md --latest

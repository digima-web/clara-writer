# Builds the download package and publishes a GitHub release
# whenever the VERSION file on main changes to a version not yet released.
# (It can also be started by hand from the Actions tab.)
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: v
        run: echo "tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Stop if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=yes" >> "$GITHUB_OUTPUT"; echo "Already released."
          else
            echo "exists=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build clara-writer.zip
        if: steps.check.outputs.exists == 'no'
        run: git archive --format=zip -o clara-writer.zip HEAD

      - name: Publish the release
        if: steps.check.outputs.exists == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          f="docs/releases/${TAG}.md"
          if [ -f "$f" ]; then cp "$f" notes.md; else echo "Clara Writer ${TAG}" > notes.md; fi
          gh release create "$TAG" clara-writer.zip Install-Clara-Writer.bat \
            --target "$GITHUB_SHA" --title "Clara Writer ${TAG#v}" --notes-file notes.md --latest
